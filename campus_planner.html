<style>
  body {
    background-color: #008080;
    font-family: Arial;
    text-align: center;
    padding: 20px;
  }
  .window {
    background-color: #c0c0c0;
    width: 400px;
    margin: auto;
    border: 2px solid #000;
    padding: 0px;
    text-align: left;
  }
  .title-bar {
    background-color: #000080;
    color: white;
    padding: 5px;
    font-weight: bold;
  }
  .content {
    padding: 10px;
  }
  button {
    background-color: #c0c0c0;
    border: 2px solid #000;
    padding: 5px 10px;
  }
</style>

<div class="window">
  <div class="title-bar">Campus Planner - By Given Mhlongo</div>
  <div class="content">
    <h2>My Tasks</h2>
    <p>1. Study Maths - Due: Friday</p>
    <p>Steps: Read chapter 3, Do exercises</p>
    <p>2. Study Math - Due: 23-12</p>
    <p>Steps: Make summary notes</p>
    <button onclick="addTask()">Add New Task</button>
    <p id="newTask"></p>
  </div>
</div>


  
 



<script>
  function addTask() {
  let title = prompt("What is your task?");
  let due = prompt("When is it due?");
  let step = prompt("What is the first small step for this task?");
  document.getElementById("newTask").innerHTML += "Task: " + title + " - Due: " + due + "<br>Step 1: " + step + "<br><br>";
}

</script>
